# Repository secrets: SSH_PRIVATE_KEY, CODECOV_TOKEN (optional)
# Repository variables: SSH_HOST, SSH_USER, DEPLOY_PATH
# Optional variable: SSH_PORT — if unset, port 22 is used
#
# Локально: pyenv + .python-version, в root/frontend — nvm/nvm use по .nvmrc.
# В CI только actions/setup-python и actions/setup-node (без pyenv/nvm).

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - "backend/**"
      - "frontend/**"

permissions:
  contents: read

jobs:
  # Шаги внутри job выполняются по порядку; при падении ruff/lint последующие не запускаются.
  backend:
    name: Backend (ruff → tests)
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test-korotkova-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies and ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install ruff==0.9.3

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Test and coverage
        env:
          DJANGO_SECRET_KEY: "ci-test-only-not-for-production-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          DJANGO_SETTINGS_MODULE: root.settings.test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test-korotkova-db
        run: python -m pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend (lint → build)
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: root/frontend/.nvmrc
          cache: yarn
          cache-dependency-path: root/frontend/yarn.lock

      - name: Prepare env for build
        working-directory: root/frontend
        run: cp .env.example .env

      - name: Install dependencies
        working-directory: root/frontend
        run: yarn install --frozen-lockfile

      - name: Generate OpenAPI client
        working-directory: root/frontend
        run: yarn schema:generate

      - name: Lint
        working-directory: root/frontend
        run: yarn lint

      - name: Build
        working-directory: root/frontend
        run: yarn build

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/backend/')
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT != '' && vars.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"
            git pull origin master
            docker build -t korotkova-admin-python-3.11:latest .
            docker compose up -d admin bot celery

            echo "=== docker compose ps ==="
            docker compose ps -a

            for name in korotkova-admin korotkova-bot korotkova-celery; do
              running=$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null || echo false)
              if [ "$running" != "true" ]; then
                echo "Container $name is not running"
                docker logs "$name" --tail 80 2>&1 || true
                exit 1
              fi
            done

            HEALTH_URL="http://127.0.0.1:8000/api/v1/health/"
            echo "Waiting for admin health ($HEALTH_URL)..."
            ok=false
            i=0
            while [ "$i" -lt 40 ]; do
              if resp=$(curl -sS --max-time 5 -w "\n%{http_code}" "$HEALTH_URL" 2>/dev/null); then
                http_code=$(printf '%s\n' "$resp" | tail -n1)
                body=$(printf '%s\n' "$resp" | sed '$d' | tr -d '\r\n')
                if [ "$http_code" = "200" ] && [ "$body" = "OK" ]; then
                  ok=true
                  break
                fi
              fi
              i=$((i + 1))
              sleep 3
            done
            if [ "$ok" != "true" ]; then
              echo "Health check failed: expected HTTP 200 and body OK at $HEALTH_URL"
              docker logs korotkova-admin --tail 100 2>&1 || true
              exit 1
            fi
            echo "Deploy verification OK (containers running, health endpoint OK)."

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/frontend/')
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT != '' && vars.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"
            git pull origin master
            docker compose run --rm assets
            docker compose exec -T korotkova-admin python manage.py collectstatic --noinput

            echo "=== verify stack after frontend deploy ==="
            docker compose ps -a
            running=$(docker inspect -f '{{.State.Running}}' korotkova-admin 2>/dev/null || echo false)
            if [ "$running" != "true" ]; then
              echo "korotkova-admin is not running"
              docker logs korotkova-admin --tail 80 2>&1 || true
              exit 1
            fi
            HEALTH_URL="http://127.0.0.1:8000/api/v1/health/"
            ok=false
            i=0
            while [ "$i" -lt 20 ]; do
              if resp=$(curl -sS --max-time 5 -w "\n%{http_code}" "$HEALTH_URL" 2>/dev/null); then
                http_code=$(printf '%s\n' "$resp" | tail -n1)
                body=$(printf '%s\n' "$resp" | sed '$d' | tr -d '\r\n')
                if [ "$http_code" = "200" ] && [ "$body" = "OK" ]; then
                  ok=true
                  break
                fi
              fi
              i=$((i + 1))
              sleep 3
            done
            if [ "$ok" != "true" ]; then
              echo "Health check failed: expected HTTP 200 and body OK at $HEALTH_URL"
              docker logs korotkova-admin --tail 100 2>&1 || true
              exit 1
            fi
            echo "Frontend deploy verification OK (health endpoint OK)."
